<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>爆米花找座位</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root {
  /* 布局：手机竖屏单列。顶部圆按钮+关卡信息，规则条，方块棋盘（格子之间留缝），底部三个圆形道具按钮 */
  --bg: #FFF7EC;          /* 爆米花奶油底 */
  --card: #FFFFFF;
  --ink: #4A3428;         /* 焦糖棕文字 */
  --ink-soft: #9A8170;
  --caramel: #E39B35;     /* 焦糖色强调 */
  --heart: #E5596C;
  --shadow: 0 3px 10px rgba(122, 82, 46, .12);
  --font-display: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  --font-body: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; touch-action: manipulation; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.5; }
button { font-family: inherit; color: inherit; cursor: pointer; border: 0; }
button:focus-visible { outline: 3px solid var(--caramel); outline-offset: 2px; }
.screen { max-width: 480px; margin: 0 auto; padding: 14px 12px 28px; min-height: 100%; display: flex; flex-direction: column; gap: 12px; }
.hidden { display: none !important; }
.round { width: 48px; height: 48px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); display: grid; place-items: center; padding: 0; flex: none; }
.round svg { width: 24px; height: 24px; }

/* ---------- 选关页 ---------- */
.brand { display: flex; align-items: center; gap: 12px; padding: 6px 4px 0; }
.brand svg { width: 60px; height: 60px; flex: none; }
.brand h1 { font-family: var(--font-display); font-weight: 400; font-size: 34px; margin: 0; line-height: 1.1; letter-spacing: 1px; }
.brand p { margin: 2px 0 0; color: var(--ink-soft); font-size: 13px; }
.panel { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 12px 12px 14px; }
.progress { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--ink-soft); }
.progress b { color: var(--ink); font-variant-numeric: tabular-nums; }
.rounds { display: flex; flex-direction: column; gap: 8px; }
.roundrow { display: grid; grid-template-columns: 52px repeat(4, 1fr); gap: 8px; align-items: center; }
.roundrow.tut { grid-template-columns: 52px repeat(3, 1fr) 1fr; }
.roundrow > span { font-size: 12px; color: var(--ink-soft); }
.lv { height: 54px; border-radius: 14px; background: #FFF1DD; font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; line-height: 1.15; }
.lv small { font-size: 10px; font-weight: 400; color: var(--ink-soft); }
.lv.done { background: var(--caramel); color: #fff; }
.lv.done small { color: #FFF1DD; }
.settings { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { background: var(--card); box-shadow: var(--shadow); border-radius: 999px; padding: 7px 14px; font-size: 13px; }
.chip[aria-pressed="true"] { background: #FFE7C2; }
.note { font-size: 12px; color: var(--ink-soft); margin: 0; }

/* ---------- 游戏页 ---------- */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.lvinfo { text-align: center; line-height: 1.2; }
.lvinfo b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 26px; }
.lvinfo span { font-size: 12px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.statusrow { display: flex; justify-content: center; }
.hearts { display: flex; gap: 6px; background: var(--card); box-shadow: var(--shadow); border-radius: 999px; padding: 6px 14px; }
.hearts svg { width: 24px; height: 24px; }
.rulebar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.rule { background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 7px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11.5px; color: var(--ink-soft); text-align: center; line-height: 1.25; }
.rule svg { width: 30px; height: 30px; }
.tip { background: #FFF1DD; border-radius: 14px; padding: 10px 12px; font-size: 14px; }
.tip b { color: #A0621A; }
.boardcard { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 8px; }
.board { --n: 6; --gap: 4px; width: 100%; aspect-ratio: 1; display: grid; gap: var(--gap); grid-template-columns: repeat(var(--n), 1fr); grid-template-rows: repeat(var(--n), 1fr); touch-action: none; user-select: none; -webkit-user-select: none; }
.cell { position: relative; border-radius: 22%; display: grid; place-items: center; overflow: hidden; }
.cell .pat { position: absolute; width: 56%; height: 56%; left: 22%; top: 22%; color: rgba(74, 52, 40, .2); pointer-events: none; }
.cell .x { position: relative; width: 52%; height: 52%; pointer-events: none; }
.cell.bad .x line { stroke: var(--heart); }
.cell svg.cat { position: relative; width: 86%; height: 86%; pointer-events: none; }
.cell.marked .pat, .cell.cat .pat { opacity: .35; }
.cell .seat { position: absolute; left: 50%; bottom: 3%; transform: translateX(-50%); font-size: 9px; line-height: 1; padding: 2px 4px; border-radius: 4px; background: rgba(74,52,40,.75); color: #fff; pointer-events: none; white-space: nowrap; }
.cell.pop svg.cat { animation: pop .28s ease-out; }
.cell.shake { animation: shake .35s; }
.cell.flash::after { content: ""; position: absolute; inset: 0; background: rgba(255,255,255,.7); animation: fade .6s forwards; pointer-events: none; }
.cell.hint::after { content: ""; position: absolute; inset: 0; border: 3px solid var(--caramel); border-radius: inherit; animation: fade 1.6s forwards; pointer-events: none; }
@keyframes pop { 0% { transform: scale(.3); } 70% { transform: scale(1.12); } 100% { transform: scale(1); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@keyframes fade { from { opacity: 1; } to { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cell.pop svg.cat, .cell.shake, .cell.flash::after, .cell.hint::after { animation: none; } }
.tools { display: flex; justify-content: center; gap: 28px; padding-top: 6px; }
.tool { position: relative; width: 72px; height: 72px; border-radius: 50%; background: var(--card); box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 12px; padding: 0; }
.tool svg { width: 28px; height: 28px; }
.badge { position: absolute; top: -4px; right: -6px; min-width: 24px; height: 24px; border-radius: 12px; background: var(--heart); color: #fff; font-size: 13px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; font-variant-numeric: tabular-nums; }
.badge.ad { background: var(--caramel); font-size: 11px; }
.howto { text-align: center; }

/* ---------- 弹窗 ---------- */
.overlay { position: fixed; inset: 0; background: rgba(74,52,40,.45); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 5; }
.dialog { background: var(--card); border-radius: 22px; padding: 22px 20px 18px; width: min(100%, 340px); text-align: center; display: flex; flex-direction: column; gap: 12px; }
.dialog h3 { font-family: var(--font-display); font-weight: 400; font-size: 27px; margin: 0; }
.dialog p { margin: 0; color: var(--ink-soft); font-size: 14px; }
.dialog svg.big { width: 88px; height: 88px; margin: 0 auto; }
.stats { display: flex; justify-content: center; gap: 18px; font-size: 14px; color: var(--ink-soft); }
.stats b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; color: var(--ink); }
.btn { border-radius: 14px; padding: 12px; font-size: 16px; font-weight: 600; background: var(--caramel); color: #fff; }
.btn.alt { background: #FFF1DD; color: #8A5A1E; }
.btn.ad { background: #4A3428; color: #fff; }
.setrow { display: flex; justify-content: space-between; align-items: center; text-align: left; font-size: 15px; padding: 4px 2px; }
.setrow button { background: #FFF1DD; border-radius: 999px; padding: 6px 14px; font-size: 14px; min-width: 64px; }
.setrow button[aria-pressed="true"] { background: var(--caramel); color: #fff; }
</style>
</head>
<body>

<section class="screen" id="home">
  <div class="brand">
    <svg viewBox="0 0 40 40" aria-hidden="true"><use href="#cat"/></svg>
    <div>
      <h1>爆米花找座位</h1>

    </div>
  </div>
  <div class="panel progress"><span>已通关 <b id="doneCount">0</b> / <b id="totalCount">51</b></span><span>本版所有关卡都开放</span></div>
  <div class="panel"><div class="rounds" id="rounds"></div></div>
  <div class="settings">
    <button class="chip" id="optSound" aria-pressed="true">音效：开</button>
    <button class="chip" id="optAuto" aria-pressed="false">自动标×：关</button>
    <button class="chip" id="optReset">清空进度</button>
  </div>

</section>

    <button class="tool" id="restartBtn" aria-label="重新开始本关"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12 a7.5 7.5 0 1 1 -2.2 -5.3" fill="none" stroke="#4A3428" stroke-width="2.4" stroke-linecap="round"/><path d="M18 3 V7.5 H13.5" fill="none" stroke="#4A3428" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>重来</button>
  </div>
  <p class="note howto">点一下标×，再点一下放爆米花；按住拖动可以连续标×，从×上开始拖可以擦掉</p>
</section>

<script>
const LEVELS = /*LEVELS*/[];
const TIPS = {
  1: "<b>规则1</b>：每一行、每一列都要正好放1只爆米花。棋盘上已经坐好了1只，它所在的那一行、那一列就不能再放了，点一下格子标上×。确定某格是座位，就再点一下放上去。",
  2: "<b>规则2</b>：每种颜色也只能有1只爆米花。先找格子最少的那种颜色下手。",
  3: "<b>规则3</b>：爆米花不喜欢挤，两只不能挨着，斜着挨也不行。从下一关开始，放错会扣一颗心。"
};
const REGION_COLORS = ["#F6C1C9", "#A8D8C8", "#F7D08A", "#B9C8F0", "#F4B183", "#CDB4E8", "#BFE3A5", "#9FD3E8", "#E8C6A8"];
const FREE_HINTS = 3;

/* 存档：只存在这个浏览器里，读不到也能正常玩 */
const SAVE_KEY = "popcorn-proto-v3";
let save = { best: {}, autoX: false, sound: true };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); if (s) save = Object.assign(save, s); } catch (e) {}
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {} }

/* 音效：用浏览器合成，不需要文件 */
let audio = null;
function tone(freqs, dur = 0.12, type = "sine", vol = 0.12) {
  if (!save.sound) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const t0 = audio.currentTime;
    freqs.forEach((f, i) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = type; o.frequency.value = f;
      const s = t0 + i * dur * 0.8;
      g.gain.setValueAtTime(0, s);
      g.gain.linearRampToValueAtTime(vol, s + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, s + dur);
      o.connect(g); g.connect(audio.destination);
      o.start(s); o.stop(s + dur + 0.02);
    });
  } catch (e) {}
}
const sfx = {
  mark: () => tone([520], 0.05, "triangle", 0.06),
  good: () => tone([660, 990], 0.11, "sine", 0.12),
  bad: () => tone([180, 140], 0.16, "square", 0.05),
  region: () => tone([1180], 0.09, "sine", 0.08),
  win: () => tone([523, 659, 784, 1046], 0.16, "triangle", 0.12)
};

const $ = id => document.getElementById(id);
const catSvg = (sym = "cat") => `<svg class="cat" viewBox="0 0 40 40" aria-hidden="true"><use href="#${sym}"/></svg>`;
const X_SVG = '<svg class="x" viewBox="0 0 20 20" aria-hidden="true"><line x1="4" y1="4" x2="16" y2="16" stroke="#5B4234" stroke-width="2.8" stroke-linecap="round"/><line x1="16" y1="4" x2="4" y2="16" stroke="#5B4234" stroke-width="2.8" stroke-linecap="round"/></svg>';
function fmt(s) { return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

/* ---------- 选关页 ---------- */
function renderHome() {
  $("totalCount").textContent = LEVELS.length;
  $("doneCount").textContent = Object.keys(save.best).filter(k => +k <= LEVELS.length).length;
  const btn = id => {
    const best = save.best[id], n = LEVELS[id - 1].n;
    return `<button class="lv${best ? " done" : ""}" data-id="${id}" aria-label="第${id}关，${n}×${n}${best ? "，已通关" : ""}">${id}<small>${best ? fmt(best) : n + "×" + n}</small></button>`;
  };
  const rows = [`<div class="roundrow tut"><span>教学</span>${[1, 2, 3].map(btn).join("")}<span></span></div>`];
  for (let r = 0; 4 + r * 4 <= LEVELS.length; r++) {
    const ids = [4, 5, 6, 7].map(k => k + r * 4).filter(id => id <= LEVELS.length);
    rows.push(`<div class="roundrow"><span>第${r + 1}轮</span>${ids.map(btn).join("")}</div>`);
  }
  $("rounds").innerHTML = rows.join("");
  $("optAuto").textContent = "自动标×：" + (save.autoX ? "开" : "关");
  $("optAuto").setAttribute("aria-pressed", save.autoX);
  $("optSound").textContent = "音效：" + (save.sound ? "开" : "关");
  $("optSound").setAttribute("aria-pressed", save.sound);
}
$("rounds").addEventListener("click", e => { const b = e.target.closest(".lv"); if (b) startLevel(+b.dataset.id); });
$("optAuto").onclick = () => { save.autoX = !save.autoX; persist(); renderHome(); };
$("optSound").onclick = () => { save.sound = !save.sound; persist(); renderHome(); };
$("optReset").onclick = () => {
  showDialog(`<h3>清空进度？</h3><p>所有通关记录会被删除。</p>
    <button class="btn" id="dYes">清空</button><button class="btn alt" id="dNo">算了</button>`);
  $("dYes").onclick = () => { save.best = {}; persist(); hideDialog(); renderHome(); };
  $("dNo").onclick = hideDialog;
};

/* ---------- 游戏状态 ---------- */
let G = null;
let timerId = null;

function startLevel(id) {
  const L = LEVELS[id - 1], n = L.n;
  G = {
    id, n,
    reg: L.reg.split(",").map(Number),
    sol: L.sol.split(",").map(Number),
    st: new Array(n * n).fill(0),        // 0 空，1 标×，2 爆米花
    auto: new Array(n * n).fill(false),  // 是不是自动标的×
    bad: new Array(n * n).fill(false),   // 放错过的格子
    given: new Set(L.given || []),       // 开局就坐好的爆米花
    hearts: 3, tutorial: id <= 3, hints: FREE_HINTS,
    undo: [], startT: Date.now(), elapsed: 0, over: false
  };
  for (const i of G.given) G.st[i] = 2;
  $("home").classList.add("hidden");
  $("game").classList.remove("hidden");
  $("lvName").textContent = `第${id}关`;
  if (TIPS[id]) { $("tip").innerHTML = TIPS[id]; $("tip").classList.remove("hidden"); }
  else $("tip").classList.add("hidden");
  buildBoard();
  renderHearts();
  renderHint();
  clearInterval(timerId);
  timerId = setInterval(tick, 500); tick();
  window.scrollTo(0, 0);
}
function tick() {
  if (!G) return;
  if (!G.over) G.elapsed = Math.floor((Date.now() - G.startT) / 1000);
  $("lvSub").textContent = `${G.n}×${G.n}${G.tutorial ? " · 教学" : ""} · ${fmt(G.elapsed)}`;
}

function buildBoard() {
  const { n, reg } = G, b = $("board");
  b.style.setProperty("--n", n);
  b.style.setProperty("--gap", n >= 9 ? "3px" : "4px");
  let html = "";
  for (let i = 0; i < n * n; i++) {
    const g = reg[i] % REGION_COLORS.length;
    html += `<div class="cell" data-i="${i}" role="gridcell" style="background:${REGION_COLORS[g]}"><svg class="pat" viewBox="0 0 24 24" aria-hidden="true"><use href="#p${g}"/></svg><span class="fg"></span></div>`;
  }
  b.innerHTML = html;
  for (let i = 0; i < n * n; i++) drawCell(i);
}
function cellEl(i) { return $("board").children[i]; }
function drawCell(i, anim) {
  const el = cellEl(i), s = G.st[i];
  el.classList.toggle("bad", G.bad[i]);
  el.classList.toggle("marked", s === 1);
  el.classList.toggle("cat", s === 2);
  el.querySelector(".fg").outerHTML = `<span class="fg" style="display:contents">${
    s === 2 ? catSvg() + (G.given.has(i) ? '<span class="seat">开局</span>' : "") : s === 1 ? X_SVG : ""}</span>`;
  const r = Math.floor(i / G.n) + 1, c = i % G.n + 1;
  el.setAttribute("aria-label", `第${r}行第${c}列，${s === 2 ? "爆米花" : s === 1 ? "已标×" : "空"}`);
  if (anim) { el.classList.remove(anim); void el.offsetWidth; el.classList.add(anim); }
}
function renderHearts() {
  const h = [];
  for (let k = 0; k < 3; k++) {
    const on = G.tutorial || k < G.hearts;
    h.push(`<svg viewBox="0 0 24 24" aria-hidden="true" style="fill:${on ? "#E5596C" : "#E8DCCF"}"><use href="#heart"/></svg>`);
  }
  $("hearts").innerHTML = h.join("");
  $("hearts").setAttribute("aria-label", G.tutorial ? "教学关不扣心" : `剩余 ${G.hearts} 颗心`);
}
function renderHint() {
  const b = $("hintBadge");
  if (G.hints > 0) { b.textContent = G.hints; b.classList.remove("ad"); }
  else { b.textContent = "广告"; b.classList.add("ad"); }
}

/* ---------- 规则判断 ---------- */
const isAnswer = i => G.sol[Math.floor(i / G.n)] === i % G.n;
function neighborsOf(i) {
  const { n, reg } = G, r = Math.floor(i / n), c = i % n, out = [];
  for (let j = 0; j < n * n; j++) {
    if (j === i) continue;
    const rj = Math.floor(j / n), cj = j % n;
    if (rj === r || cj === c || reg[j] === reg[i] || (Math.abs(rj - r) <= 1 && Math.abs(cj - c) <= 1)) out.push(j);
  }
  return out;
}
const conflictsWithCat = i => neighborsOf(i).some(j => G.st[j] === 2);

function setMark(i, val, batch) {
  if (G.st[i] === 2 || G.bad[i]) return false;
  const want = val ? 1 : 0;
  if (G.st[i] === want) return false;
  batch.push([i, G.st[i], G.auto[i]]);
  G.st[i] = want; G.auto[i] = false;
  drawCell(i);
  return true;
}
function flashTip(text) { $("tip").innerHTML = text; $("tip").classList.remove("hidden"); }

function tryPlace(i) {
  if (G.over || G.st[i] === 2 || G.bad[i]) return;
  // 和已经坐好的爆米花明显冲突：只提醒，不扣心
  if (conflictsWithCat(i)) {
    drawCell(i, "shake"); sfx.bad();
    flashTip("这一格和已经坐好的爆米花冲突（同行、同列、同色或挨着），不扣心，换一格吧。");
    return;
  }
  if (isAnswer(i)) {
    G.st[i] = 2; G.auto[i] = false;
    drawCell(i, "pop"); sfx.good();
    if (save.autoX) for (const j of neighborsOf(i)) if (G.st[j] === 0) { G.st[j] = 1; G.auto[j] = true; drawCell(j); }
    const g = G.reg[i];
    setTimeout(() => { for (let j = 0; j < G.n * G.n; j++) if (G.reg[j] === g) drawCell(j, "flash"); sfx.region(); }, 180);
    G.undo = [];
    checkWin();
  } else {
    G.bad[i] = true; G.st[i] = 1; G.auto[i] = false;
    drawCell(i, "shake"); sfx.bad();
    if (!G.tutorial) {
      G.hearts--; renderHearts();
      if (G.hearts <= 0) return fail();
    } else {
      flashTip("这里不是座位。想想同一行、同一列、同一种颜色，还有周围一圈。教学关不扣心。");
    }
  }
}

function checkWin() {
  if (G.st.filter(v => v === 2).length < G.n) return;
  G.over = true; clearInterval(timerId); tick();
  const prev = save.best[G.id];
  if (!prev || G.elapsed < prev) save.best[G.id] = Math.max(1, G.elapsed);
  persist();
  setTimeout(() => {
    sfx.win();
    const next = G.id < LEVELS.length;
    showDialog(`<svg class="big" viewBox="0 0 40 40" aria-hidden="true"><use href="#cat"/></svg>
      <h3>都找到座位啦！</h3>
      <div class="stats"><div>用时<b>${fmt(G.elapsed)}</b></div><div>剩余的心<b>${G.tutorial ? "—" : G.hearts}</b></div><div>最快<b>${fmt(save.best[G.id])}</b></div></div>
      ${next ? '<button class="btn" id="dNext">下一关</button>' : "<p>已经是最后一关了，厉害！</p>"}
      <button class="btn alt" id="dHome">回到选关</button>`);
    if (next) $("dNext").onclick = () => { hideDialog(); startLevel(G.id + 1); };
    $("dHome").onclick = () => { hideDialog(); goHome(); };
  }, 650);
}

function fail() {
  G.over = true; clearInterval(timerId);
  setTimeout(() => {
    showDialog(`<svg class="big" viewBox="0 0 40 40" aria-hidden="true"><use href="#sadcat"/></svg>
      <h3>心用完了</h3><p>爆米花们还挤在一起。看个广告就能拿回1颗心接着玩。</p>
      <button class="btn ad" id="dRevive">看广告复活（原型直接复活）</button>
      <button class="btn alt" id="dRetry">重新开始本关</button>
      <button class="btn alt" id="dHome">回到选关</button>`);
    $("dRevive").onclick = () => {
      hideDialog(); G.hearts = 1; G.over = false; renderHearts();
      G.startT = Date.now() - G.elapsed * 1000; timerId = setInterval(tick, 500);
    };
    $("dRetry").onclick = () => { hideDialog(); startLevel(G.id); };
    $("dHome").onclick = () => { hideDialog(); goHome(); };
  }, 400);
}

function goHome() {
  clearInterval(timerId); G = null;
  $("game").classList.add("hidden"); $("home").classList.remove("hidden");
  renderHome(); window.scrollTo(0, 0);
}
$("backBtn").onclick = goHome;
$("restartBtn").onclick = () => G && startLevel(G.id);
$("undoBtn").onclick = () => {
  if (!G || G.over || !G.undo.length) return;
  const batch = G.undo.pop();
  for (let k = batch.length - 1; k >= 0; k--) { const [i, st, au] = batch[k]; G.st[i] = st; G.auto[i] = au; drawCell(i); }
};
$("hintBtn").onclick = () => {
  if (!G || G.over) return;
  // 找空格最少、还没坐爆米花的颜色区，把它的座位告诉玩家
  let best = -1, bestCount = 1e9;
  for (let r = 0; r < G.n; r++) {
    const i = r * G.n + G.sol[r];
    if (G.st[i] === 2) continue;
    let cnt = 0;
    for (let j = 0; j < G.n * G.n; j++) if (G.reg[j] === G.reg[i] && G.st[j] === 0) cnt++;
    if (cnt < bestCount) { bestCount = cnt; best = i; }
  }
  if (best < 0) return;
  if (G.hints > 0) G.hints--; // 用完以后正式版要看广告，原型直接给
  renderHint();
  G.bad[best] = false;
  if (G.st[best] === 1) G.st[best] = 0;
  drawCell(best, "hint");
  tryPlace(best);
};
$("setBtn").onclick = () => {
  const row = (id, label, on) => `<div class="setrow"><span>${label}</span><button id="${id}" aria-pressed="${on}">${on ? "开" : "关"}</button></div>`;
  showDialog(`<h3>设置</h3>
    ${row("sSound", "音效", save.sound)}
    ${row("sAuto", "放下爆米花后自动标×", save.autoX)}
    ${row("sRules", "显示规则卡片", !$("rulebar").classList.contains("hidden"))}
    <button class="btn alt" id="sClose">好的</button>`);
  $("sSound").onclick = () => { save.sound = !save.sound; persist(); $("setBtn").onclick(); };
  $("sAuto").onclick = () => { save.autoX = !save.autoX; persist(); $("setBtn").onclick(); };
  $("sRules").onclick = () => { $("rulebar").classList.toggle("hidden"); $("setBtn").onclick(); };
  $("sClose").onclick = hideDialog;
};

/* ---------- 点击和拖动 ---------- */
(function bindBoard() {
  const b = $("board");
  let down = null;
  const idxAt = (x, y) => {
    const el = document.elementFromPoint(x, y);
    const c = el && el.closest ? el.closest(".cell") : null;
    return c && b.contains(c) ? +c.dataset.i : -1;
  };
  b.addEventListener("pointerdown", e => {
    if (!G || G.over) return;
    const i = idxAt(e.clientX, e.clientY); if (i < 0) return;
    e.preventDefault();
    try { b.setPointerCapture(e.pointerId); } catch (err) {}
    down = { i, moved: false, mode: G.st[i] === 0 ? "mark" : (G.st[i] === 1 && !G.bad[i] ? "erase" : null), batch: [], visited: new Set([i]) };
  });
  b.addEventListener("pointermove", e => {
    if (!down || !down.mode) return;
    const i = idxAt(e.clientX, e.clientY);
    if (i < 0 || down.visited.has(i)) return;
    if (!down.moved) { down.moved = true; setMark(down.i, down.mode === "mark", down.batch); }
    down.visited.add(i);
    if (setMark(i, down.mode === "mark", down.batch)) sfx.mark();
  });
  b.addEventListener("pointerup", () => {
    if (!down) return;
    const d = down; down = null;
    if (d.moved) { if (d.batch.length) G.undo.push(d.batch); return; }
    const i = d.i;
    if (G.st[i] === 0) { const batch = []; setMark(i, true, batch); G.undo.push(batch); sfx.mark(); }
    else if (G.st[i] === 1 && !G.bad[i]) tryPlace(i);
  });
  b.addEventListener("pointercancel", () => { if (down && down.batch.length) G.undo.push(down.batch); down = null; });
})();

/* ---------- 弹窗 ---------- */
function showDialog(html) { $("dialog").innerHTML = html; $("overlay").classList.remove("hidden"); }
function hideDialog() { $("overlay").classList.add("hidden"); }

/* 防止双击、双指把页面放大（iPhone 的 Safari 会无视 user-scalable=no） */
document.addEventListener("dblclick", e => e.preventDefault(), { passive: false });
document.addEventListener("gesturestart", e => e.preventDefault(), { passive: false });
let lastTouchEnd = 0;
document.addEventListener("touchend", e => {
  if (e.target.closest && e.target.closest("button")) return; // 按钮不拦，连点按钮不会被吞
  const now = Date.now();
  if (now - lastTouchEnd < 350) e.preventDefault();
  lastTouchEnd = now;
}, { passive: false });

renderHome();
</script>
</body>
</html>
